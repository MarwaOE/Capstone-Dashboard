<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IATS Capstone 2.0 Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <header>
            <div class="title-area">
                <h1>IATS Capstone 2.0 Facilitator Dashboard</h1>
                <p>Annual Curriculum Execution Plan, Interactive Worksheet Links, and Weekly Tracker</p>
            </div>
        </header>

        <div class="controls">
            <div class="tabs">
                <button class="tab-btn active" onclick="filterGrade('juniors')">Juniors (Grade 1)</button>
                <button class="tab-btn" onclick="filterGrade('wheelers')">Wheelers (Grade 2)</button>
                <button class="tab-btn" onclick="filterGrade('seniors')">Seniors (Grade 3)</button>
            </div>

            <div class="search-box">
                <input type="text" id="searchInput" onkeyup="searchTable()"
                    placeholder="Search week, status, topic, PPT, notes...">
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 10%;">Phase</th>
                        <th style="width: 4%;">Week</th>
                        <th style="width: 6%;">Session</th>
                        <th style="width: 11%;">Weekly Status</th>
                        <th style="width: 10%;">PPT / Reference</th>
                        <th style="width: 16%;">Topic & Content</th>
                        <th style="width: 16%;">In-Class Activity</th>
                        <th style="width: 15%;">Deliverables</th>
                        <th style="width: 12%;">Weekly Comments</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Pop-up for PPT References -->
    <div class="modal-overlay" id="infoModal">
        <div class="modal-card">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div class="modal-header">
                <h2 id="modalTitle">Resource Preview</h2>
                <span id="modalMeta">Capstone Reference Material</span>
            </div>
            <div class="modal-body" id="modalBody">
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal()">Close</button>
                <button class="btn-primary" onclick="alert('Downloading resource file...')">Download Reference
                    Deck</button>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>

</html>
